[project]
name = "loosechange"
version = "0.1.0"
description = "Free OpenRouter LLMs ranked by benchmarks, matched to your task, added to Hermes / VibeForge in one command."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
bot = ["aiogram>=3.13"]

[project.scripts]
loosechange = "loosechange.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "aiogram>=3.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loosechange"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
